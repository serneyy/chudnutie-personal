name: Diagnostika Open Food Facts API
on:
  push:
    paths:
      - '.github/workflows/check-food-api.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Overenie skutocnych API endpointov a CORS
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, socket
          socket.setdefaulttimeout(12)
          checks=[
            ("legacy", "https://world.openfoodfacts.org/cgi/search.pl?search_terms=protein&search_simple=1&action=process&json=1&page_size=2"),
            ("forma_exact", "https://world.openfoodfacts.org/cgi/search.pl?search_terms=protein&search_simple=1&action=process&json=1&page_size=10&fields=code,product_name,product_name_sk,product_name_en,brands,serving_size,serving_quantity,serving_quantity_unit,product_quantity,product_quantity_unit,nutriments"),
            ("searchalicious", "https://search.openfoodfacts.org/search?q=protein&page_size=2&langs=sk,en"),
            ("searchalicious_post", "https://search.openfoodfacts.org/search"),
            ("v2_category", "https://world.openfoodfacts.org/api/v2/search?categories_tags_en=protein-bars&page_size=2&fields=code,product_name,brands,nutriments"),
            ("barcode", "https://world.openfoodfacts.org/api/v3/product/3017624010701?fields=code,product_name,nutriments")
          ]
          for name,url in checks:
            try:
              headers={"Origin":"https://serneyy.github.io","Accept":"application/json","User-Agent":"FORMA-Personal/1.0 (personal family nutrition tracker)"}
              if name.endswith("_post"):
                body=json.dumps({"q":"protein","langs":["sk","en"],"page_size":2,"page":1}).encode()
                request=urllib.request.Request(url,data=body,headers={**headers,"Content-Type":"application/json"},method="POST")
              else:request=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(request,timeout=12) as response:
                body=response.read(4000).decode("utf-8",errors="replace")
                print(name,"STATUS",response.status,"CORS",response.headers.get("Access-Control-Allow-Origin","MISSING"),"TYPE",response.headers.get("Content-Type"),"BODY",repr(body[:380]))
            except urllib.error.HTTPError as error:
              print(name,"HTTP_ERROR",error.code,"CORS",error.headers.get("Access-Control-Allow-Origin","MISSING"),"BODY",repr(error.read(250).decode(errors="replace")))
            except Exception as error:
              print(name,"ERROR",type(error).__name__,str(error)[:180])
          PY
