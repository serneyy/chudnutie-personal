name: FORMA - test mobilnej aplikacie
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Kontrola syntaxe
        run: |
          node --check app.js
          node --check tests/smoke.cjs
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          j=Path("app.js").read_text(encoding="utf-8")
          assert '<html lang="sk">' in s
          assert 'src="app.js?v=7"' in s
          assert Path("styles.css").exists()
          assert Path("manifest.webmanifest").exists()
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=set()
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if "id" in d:
                      assert d["id"] not in self.ids, f"Duplicated id: {d['id']}"
                      self.ids.add(d["id"])
          parser=Check()
          parser.feed(s)
          used=set(re.findall(r'\$\("([^"]+)"\)',j))
          missing=sorted(used-parser.ids)
          assert not missing, f"Missing DOM IDs: {missing}"
          print("HTML IDs:",len(parser.ids),"referenced:",len(used),"all present")
          PY
      - name: Instalacia browser testov
        run: |
          npm install --no-save playwright@1.56.1 bwip-js@4 zxing-wasm@3.1.6
          npx playwright install --with-deps chromium
      - name: Spustenie lokalneho webu
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/forma-server.log 2>&1 &
          sleep 2
      - name: Mobilny browser smoke test
        run: node tests/smoke.cjs
